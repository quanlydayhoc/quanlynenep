<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sổ đầu bài điện tử – THPT Bình Thạnh Đông</title>
<meta name="description" content="Sổ đầu bài điện tử, sổ nề nếp, thi đua tuần và đánh giá hạnh kiểm tháng">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Lora:wght@600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
<style>
/* Bìa sổ xanh mực + chỉ vàng; dải điều hướng; các trang sổ kẻ dòng */
:root{
  --bg:#eef1f6; --paper:#ffffff; --paper2:#f5f7fb; --ink:#14243d; --muted:#5b6880; --line:#d6dce6; --line2:#e7ebf1;
  --cover:#1d3557; --cover2:#26507d; --cover-fg:#f3f6fb; --gold:#e3a72f; --gold-soft:#fbefd2;
  --accent:#2563a6; --accent-soft:#e3edf8;
  --red:#c42b2b; --red-bg:#fdecec; --pink:#c2255c; --pink-bg:#fce4ee; --green:#2b8a3e; --green-bg:#e3f5e6;
  --amber:#b7791f; --amber-bg:#fdf3dc; --silver:#7d8896; --bronze:#a8662f;
  --shadow:0 1px 2px rgba(20,36,61,.06),0 8px 24px rgba(20,36,61,.07);
  --f-ui:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --f-head:"Lora",Georgia,"Times New Roman",serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1622; --paper:#161f2e; --paper2:#1b2637; --ink:#e6ebf3; --muted:#9aa7bb; --line:#2c3a50; --line2:#233046;
  --cover:#122238; --cover2:#1a3150; --cover-fg:#eef2f8; --gold:#e8b44a; --gold-soft:#3a2f17;
  --accent:#6aa5e6; --accent-soft:#1d2f47;
  --red:#ff7b7b; --red-bg:#3a1c20; --pink:#f17aa6; --pink-bg:#3a1d2b; --green:#6fd58a; --green-bg:#173323;
  --amber:#f0be5c; --amber-bg:#3a2e14; --silver:#aab4c0; --bronze:#d39a64;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1622; --paper:#161f2e; --paper2:#1b2637; --ink:#e6ebf3; --muted:#9aa7bb; --line:#2c3a50; --line2:#233046;
  --cover:#122238; --cover2:#1a3150; --cover-fg:#eef2f8; --gold:#e8b44a; --gold-soft:#3a2f17;
  --accent:#6aa5e6; --accent-soft:#1d2f47;
  --red:#ff7b7b; --red-bg:#3a1c20; --pink:#f17aa6; --pink-bg:#3a1d2b; --green:#6fd58a; --green-bg:#173323;
  --amber:#f0be5c; --amber-bg:#3a2e14; --silver:#aab4c0; --bronze:#d39a64;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink);margin:0}
body{font-family:var(--f-ui);font-size:14px;line-height:1.45;padding-top:env(safe-area-inset-top,0px)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
[hidden]{display:none!important}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.tab-num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}

/* Bìa */
.cover{background:linear-gradient(135deg,var(--cover),var(--cover2));color:var(--cover-fg);border-bottom:4px solid var(--gold)}
.cover-in{max-width:1500px;margin:0 auto;padding-block:14px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.crest{width:48px;height:48px;border-radius:12px;background:var(--gold);color:var(--cover);display:grid;place-items:center;font-family:var(--f-head);font-weight:700;font-size:17px;flex:none;letter-spacing:.02em}
.crest.has-logo{background:#fff;padding:3px}
.crest img{width:100%;height:100%;object-fit:contain;border-radius:9px;display:block}
.brand{min-width:0;flex:1}
.lg-school{display:flex;gap:12px;align-items:center;padding-bottom:14px;border-bottom:1px solid var(--line)}
.lg-school:empty{display:none}
.lg-school img{width:52px;height:52px;object-fit:contain;border-radius:10px;background:#fff;border:1px solid var(--line);padding:3px}
.lg-school small{display:block;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.lg-school b{font-family:var(--f-head);font-size:17px}
.logo-prev{width:112px;height:112px;border:2px dashed var(--line);border-radius:14px;display:grid;place-items:center;background:var(--paper2);overflow:hidden;flex:none}
.logo-prev img{width:100%;height:100%;object-fit:contain;background:#fff}
.logo-prev span{font-size:12px;color:var(--muted);text-align:center;padding:8px}
.brand small{display:block;text-transform:uppercase;letter-spacing:.12em;font-size:11px;opacity:.82}
.brand h1{margin:0;font-family:var(--f-head);font-size:24px;line-height:1.15;text-wrap:balance}
.who{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.who .chip{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);padding:6px 11px;border-radius:999px;font-size:13px}
.who .chip b{font-weight:600}
.role{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.04em;padding:1px 7px;border-radius:999px;background:var(--gold);color:var(--cover);margin-left:4px}
.btn-c{background:transparent;border:1px solid rgba(255,255,255,.35);color:var(--cover-fg);padding:6px 12px;border-radius:8px;cursor:pointer}
.btn-c:hover{background:rgba(255,255,255,.1)}

/* Điều hướng */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-bottom:1px solid var(--line);box-shadow:0 2px 10px rgba(20,36,61,.05)}
.nav-in{max-width:1500px;margin:0 auto;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.nav button{border:0;background:transparent;padding:13px 16px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
.nav button:hover{color:var(--ink)}
.nav button.on{color:var(--ink);border-bottom-color:var(--gold)}

/* Chung */
.wrap{max-width:1500px;margin:0 auto;padding-block:18px;display:flex;flex-direction:column;gap:14px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);min-width:0}
.card-h{padding:14px 16px 0;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.card-h h2{margin:0;font-family:var(--f-head);font-size:18px;flex:1;min-width:0;text-wrap:balance}
.card-b{padding:14px 16px 16px;display:flex;flex-direction:column;gap:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--paper);padding:8px 14px;border-radius:9px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#1d2433}
.btn.danger{color:var(--red);border-color:var(--red)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
label.f{display:flex;flex-direction:column;gap:5px;font-size:12.5px;font-weight:600;color:var(--muted);min-width:0}
.req{color:var(--red)}
.in{border:1px solid var(--line);background:var(--paper2);border-radius:9px;padding:8px 10px;width:100%;color:var(--ink);font-weight:400;font-size:14px;min-width:0}
textarea.in{resize:vertical;min-height:58px}
.in:focus{border-color:var(--accent);outline:none;background:var(--paper)}
.in.num{max-width:110px;text-align:right;font-variant-numeric:tabular-nums}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:760px){.g2,.g3,.g4{grid-template-columns:minmax(0,1fr)}}
.note{background:var(--gold-soft);border:1px solid var(--gold);border-radius:10px;padding:10px 12px;font-size:13px}
.err{color:var(--red);font-size:13px;min-height:18px}
code.k{background:var(--paper2);border:1px solid var(--line);border-radius:5px;padding:1px 6px;font-size:12px}
.empty{padding:28px;text-align:center;color:var(--muted)}

/* Đăng nhập */
.login{max-width:460px;margin:36px auto;padding:26px;display:flex;flex-direction:column;gap:16px}
.login h2{margin:0;font-family:var(--f-head);font-size:22px}
.seg{display:flex;background:var(--paper2);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{flex:1;border:0;background:transparent;padding:8px;border-radius:8px;cursor:pointer;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--paper);color:var(--ink);box-shadow:var(--shadow)}
.seg.tru button.on{color:var(--red)} .seg.cong button.on{color:var(--green)}

/* Thanh tuần */
.toolbar{padding:14px 16px;display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap}
.toolbar .grow{flex:1}
.weeknav{display:flex;align-items:center;gap:6px}
.weeknav .wk{background:var(--cover);color:var(--cover-fg);border-radius:10px;padding:6px 14px;text-align:center;min-width:210px}
.weeknav .wk b{display:block;font-family:var(--f-head);font-size:17px}
.weeknav .wk span{font-size:12px;opacity:.85}
.iconbtn{width:36px;height:36px;border-radius:9px;border:1px solid var(--line);background:var(--paper);cursor:pointer;font-size:18px;line-height:1}
.iconbtn:hover{border-color:var(--accent)}
@media (max-width:640px){.weeknav{width:100%}.weeknav .wk{min-width:0;flex:1}.brand h1{font-size:20px}}
.stats{display:flex;gap:8px;flex-wrap:wrap;padding:0 16px 14px}
.stat{display:inline-flex;align-items:baseline;gap:6px;border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:13px;background:var(--paper2)}
.stat b{font-size:15px;font-variant-numeric:tabular-nums}
.stat.r{border-color:var(--red);color:var(--red);background:var(--red-bg)}
.stat.p{border-color:var(--pink);color:var(--pink);background:var(--pink-bg)}
.stat.g{border-color:var(--green);color:var(--green);background:var(--green-bg)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);padding:0 16px 12px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px}

/* Trang sổ đầu bài */
.sheet{overflow:auto;max-height:calc(100vh - 150px);border-radius:14px}
table.sdb{border-collapse:separate;border-spacing:0;width:100%;min-width:1500px;font-size:13px}
.sdb th{position:sticky;top:0;z-index:3;background:var(--cover);color:var(--cover-fg);font-weight:600;text-align:left;padding:9px 8px;font-size:12px;border-right:1px solid rgba(255,255,255,.12)}
.sdb th.grp-r{background:#8e2a2a} .sdb th.grp-g{background:#2b6a3a}
.sdb td{border-bottom:1px solid var(--line2);border-right:1px solid var(--line2);padding:6px 8px;vertical-align:top;background:var(--paper)}
.sdb td.day{position:sticky;left:0;z-index:2;background:var(--paper2);width:92px;border-right:2px solid var(--line);vertical-align:middle;text-align:center}
.sdb td.day b{display:block;font-family:var(--f-head);font-size:15px}
.sdb td.day span{font-size:12px;color:var(--muted)}
.sdb td.day.today{background:var(--gold-soft)} .sdb td.day.today span{color:var(--amber);font-weight:600}
.sdb td.buoi{width:40px;background:var(--paper2);text-align:center;vertical-align:middle;font-weight:600;color:var(--muted);writing-mode:vertical-rl;transform:rotate(180deg);letter-spacing:.1em;font-size:12px}
.sdb td.tiet{width:40px;text-align:center;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums}
.sdb tr.endday td{border-bottom:2px solid var(--line)}
.sdb tr.slot{cursor:pointer}
.sdb tr.slot:hover td:not(.day):not(.buoi){background:var(--accent-soft)}
.sdb tr.slot.locked{cursor:default}
.sdb tr.slot.locked:hover td:not(.day):not(.buoi){background:var(--paper)}
.sdb tr.edited td:not(.day):not(.buoi),.sdb tr.edited:hover td:not(.day):not(.buoi){background:var(--red-bg);color:var(--red)}
.sdb tr.edited td.tiet{box-shadow:inset 3px 0 0 var(--red)}
.addhint{color:var(--muted);opacity:0;font-size:12px}
tr.slot:hover .addhint{opacity:1}
.mon{font-weight:700}
.pill{display:inline-block;padding:1px 8px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.pill.A,.pill.tot{background:var(--green-bg);color:var(--green)}
.pill.B,.pill.kha{background:var(--accent-soft);color:var(--accent)}
.pill.C,.pill.dat{background:var(--amber-bg);color:var(--amber)}
.pill.D,.pill.cd{background:var(--red-bg);color:var(--red)}
.it{display:block;line-height:1.35;margin-bottom:3px}
.it.r{color:var(--red)} .it.p{color:var(--pink)} .it.g{color:var(--green)}
.it small{opacity:.8}
.sign{font-size:12px;line-height:1.3}
.sign b{display:block;font-weight:600}
.sign .edit{display:block;color:var(--red);font-weight:600;margin-top:2px}
.wrapc{white-space:pre-wrap;word-break:break-word}

/* Bảng danh sách */
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table.lst{border-collapse:collapse;width:100%;font-size:13px}
.lst th{background:var(--paper2);text-align:left;padding:8px;border-bottom:1px solid var(--line);font-size:12px;color:var(--muted);white-space:nowrap}
.lst td{padding:7px 8px;border-bottom:1px solid var(--line2);vertical-align:top}
.lst tr:last-child td{border-bottom:0}
.lst th.n{text-align:right}
.lst td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.lst tr.sel td{background:var(--accent-soft)}
.lst tr.click{cursor:pointer}
.lst tr.click:hover td{background:var(--paper2)}
.neg{color:var(--red);font-weight:600} .pos{color:var(--green);font-weight:600}

/* Thi đua */
.two{display:grid;grid-template-columns:minmax(0,380px) minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:980px){.two{grid-template-columns:minmax(0,1fr)}}
.rank{width:30px;height:30px;border-radius:50%;display:inline-grid;place-items:center;font-weight:700;font-size:13px;background:var(--paper2);border:1px solid var(--line)}
.rank.r1{background:var(--gold);border-color:var(--gold);color:#1d2433}
.rank.r2{background:var(--silver);border-color:var(--silver);color:#fff}
.rank.r3{background:var(--bronze);border-color:var(--bronze);color:#fff}
.score{font-family:var(--f-head);font-size:17px;font-weight:700;font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:3px;background:var(--line2);overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:3px}
.pts{font-size:12.5px;padding:6px 10px;border-radius:8px;background:var(--paper2);border:1px dashed var(--line)}

/* Mục chọn trong form */
.items{display:flex;flex-direction:column;gap:8px}
.itemrow{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1.6fr) minmax(0,1fr) auto;gap:8px;align-items:center}
@media (max-width:760px){.itemrow{grid-template-columns:minmax(0,1fr)}}
.box{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px}
.box.r{border-color:var(--red);background:var(--red-bg)}
.box.g{border-color:var(--green);background:var(--green-bg)}
.box h4{margin:0;font-size:13px;text-transform:uppercase;letter-spacing:.06em;display:flex;justify-content:space-between;gap:8px;align-items:center}
.box.r h4{color:var(--red)} .box.g h4{color:var(--green)}
.x{border:0;background:transparent;cursor:pointer;font-size:20px;line-height:1;color:var(--muted);padding:4px 8px}
.x:hover{color:var(--red)}
.rates{display:flex;gap:8px;flex-wrap:wrap}
.rates label{display:flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:9px;padding:7px 12px;cursor:pointer;font-weight:600;background:var(--paper)}
.rates input{accent-color:var(--accent)}
.hist{font-size:12.5px;color:var(--red);border-left:3px solid var(--red);padding-left:10px}
.sigline{display:flex;gap:10px;align-items:center;background:var(--accent-soft);border-radius:10px;padding:10px 12px}
.sigline input{width:18px;height:18px;accent-color:var(--accent)}

/* Hộp thoại */
.modal{position:fixed;inset:0;background:rgba(10,18,32,.55);z-index:50;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:max(20px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 30px max(12px,env(safe-area-inset-left,0px))}
.dlg{background:var(--paper);border-radius:16px;width:100%;max-width:900px;box-shadow:0 20px 60px rgba(0,0,0,.35);overflow:hidden}
.dlg.sm{max-width:460px}
.dlg-h{background:var(--cover);color:var(--cover-fg);padding:14px 18px;display:flex;gap:10px;align-items:center}
.dlg-h h3{margin:0;font-family:var(--f-head);font-size:18px;flex:1;min-width:0}
.dlg-h .x{color:var(--cover-fg)}
.dlg-b{padding:18px;display:flex;flex-direction:column;gap:14px}
.dlg-f{padding:14px 18px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;background:var(--paper2)}
@media (prefers-reduced-motion:no-preference){.dlg{animation:pop .18s ease-out}@keyframes pop{from{transform:translateY(8px);opacity:.6}to{transform:none;opacity:1}}}

/* Cấu hình */
.subtabs{display:flex;gap:6px;flex-wrap:wrap}
.subtabs button{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:6px 14px;cursor:pointer;font-weight:600;color:var(--muted)}
.subtabs button.on{background:var(--cover);border-color:var(--cover);color:var(--cover-fg)}
.cat .in{padding:5px 7px;font-size:13px;border-radius:7px}
.cat td{padding:4px 5px}
.roles{display:flex;gap:10px;flex-wrap:wrap}
.roles label{display:flex;gap:5px;align-items:center;font-weight:500;color:var(--ink)}

/* Báo cáo */
.reports{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:980px){.reports{grid-template-columns:minmax(0,1fr)}}
.preview{max-height:460px;overflow:auto}
.kpis{display:flex;gap:8px;flex-wrap:wrap}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:10px;z-index:80;box-shadow:var(--shadow);max-width:90vw}
.foot{max-width:1500px;margin:0 auto;padding-block:8px 24px;font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<header class="cover">
  <div class="cover-in gut">
    <div class="crest" id="crest">BTĐ</div>
    <div class="brand">
      <small id="schoolLine">Sở GD&amp;ĐT An Giang · Trường THPT Bình Thạnh Đông</small>
      <h1>Sổ đầu bài điện tử</h1>
    </div>
    <div class="who" id="who"></div>
  </div>
</header>
<nav class="nav" id="nav" hidden><div class="nav-in gut" id="navIn"></div></nav>

<main class="gut">
  <section id="loginView" class="card login">
    <div class="lg-school" id="lgSchool"></div>
    <h2>Đăng nhập</h2>
    <div class="seg">
      <button id="segGv" class="on" type="button">Giáo viên · Đoàn · BGH</button>
      <button id="segAd" type="button">Quản trị</button>
    </div>
    <form id="loginForm" class="grid">
      <label class="f" id="lblUser">Tài khoản
        <input class="in" id="lgUser" autocomplete="username" placeholder="Tài khoản do quản trị cấp">
      </label>
      <label class="f">Mật khẩu
        <input class="in" id="lgPass" type="password" autocomplete="current-password">
      </label>
      <div class="err" id="lgErr"></div>

/* ---------- Tiện ích ---------- */

function coreDateOf(cfg, week, day) { return coreISO(coreParseISO(cfg.school.startDate) + ((week - 1) * 7 + day) * 864e5); }

    var roles = (Array.isArray(a.roles) ? a.roles : coreList(a.roles)).map(coreUp).filter(function (r) { return CORE_ROLES[r]; });
    if (!roles.length) roles = ['GV'];
    return {
      id: coreStr(a.id).trim() || ('tk_' + tk), name: coreStr(a.name).trim(), tk: tk, mk: coreStr(a.mk) || '123456', mon: coreStr(a.mon).trim(),
      lop: (Array.isArray(a.lop) ? a.lop : coreList(a.lop)).map(coreUp).filter(function (x) { return x; }), cn: coreUp(a.cn), roles: roles

// Xuất báo cáo: GVCN (lớp mình), Đoàn trường, Ban giám hiệu, hoặc người được quản trị cấp quyền XUAT (toàn trường)

/* Gắn mục danh mục vào bản ghi (chụp lại tên và điểm tại thời điểm ghi) */
function coreResolve(cfg, items, loai, lop, needHS) {
  var roster = cfg.students[lop] || [];
  return (items || []).slice(0, 60).map(function (x) {
    var it = cfg.catalog.filter(function (c) { return c.ma === coreUp(x.ma) && c.loai === loai; })[0];
    if (!it) coreErr('Mục "' + coreStr(x.ma) + '" không có trong danh mục.', 'bad');
    var hs = coreStr(x.hs).replace(/\s+/g, ' ').trim();
    if (it.phamVi === 'hs' || needHS) {
      if (!hs) coreErr('Chọn học sinh cho mục "' + it.ten + '".', 'bad');
      if (roster.length && roster.indexOf(hs) < 0) coreErr('Học sinh "' + hs + '" không có trong danh sách lớp ' + lop + '.', 'bad');
    } else hs = '';

function coreSig(o) {

/* ---------- Các thao tác ---------- */
function coreActions(store) {

    var s = p.token ? store.sessGet(p.token) : null;

    brand: function () { var sc = cfg().school; return { ten: sc.ten, so: sc.so, namHoc: sc.namHoc, logo: sc.logo || '' }; },

    login: function (p) {

/* ---------- Bộ lưu dùng thử trên trình duyệt (cùng giao diện với máy chủ Sheets) ---------- */
function makeLocalStore() {
  var K = 'sdb_btd_v2';
  var db;
  try { db = JSON.parse(localStorage.getItem(K)) || {}; } catch (e) { db = {}; }
  db.weeks = db.weeks || {}; db.nenep = db.nenep || []; db.sess = db.sess || {};
  function save() { try { localStorage.setItem(K, JSON.stringify(db)); } catch (e) { coreErr('Trình duyệt không cho lưu dữ liệu (bộ nhớ đầy hoặc bị chặn).', 'store'); } }
  return {
    getCfg: function () { return coreMergeCfg(db.cfg ? coreClone(db.cfg) : null); },
    setCfg: function (c) { db.cfg = c; save(); },
    getWeek: function (l, w) { var d = db.weeks[l + '|' + w]; return d ? coreClone(d) : { lop: l, week: w, slots: {} }; },
    putSlot: function (l, w, k, e) {
      var id = l + '|' + w, d = db.weeks[id] || { lop: l, week: w, slots: {} };
      if (e) d.slots[k] = e; else delete d.slots[k];
      db.weeks[id] = d; save();
    },
    weeks: function (lops, w1, w2) {
      return Object.keys(db.weeks).map(function (k) { return db.weeks[k]; })
        .filter(function (d) { return lops.indexOf(d.lop) >= 0 && d.week >= w1 && d.week <= w2; }).map(coreClone);
    },
    nenep: function (w1, w2) { return db.nenep.filter(function (r) { return r.tuan >= w1 && r.tuan <= w2; }).map(coreClone); },
    nenepAdd: function (r) { db.nenep.push(r); save(); },
    nenepGet: function (id) { return db.nenep.filter(function (r) { return r.id === id; })[0] || null; },
    nenepDel: function (id) { db.nenep = db.nenep.filter(function (r) { return r.id !== id; }); save(); },
    replaceAll: function (weeks, nn) {
      db.weeks = {};
      weeks.forEach(function (d) { if (d && d.lop) db.weeks[coreUp(d.lop) + '|' + d.week] = d; });
      db.nenep = nn.filter(function (r) { return r && r.id; });
      save();
    },
    sessPut: function (t, s) { db.sess[t] = s; save(); },
    sessGet: function (t) { return db.sess[t] || null; },
    sessDel: function (t) { delete db.sess[t]; save(); },
    uuid: function () { return (Math.random().toString(36).slice(2) + Date.now().toString(36) + Math.random().toString(36).slice(2)).replace(/[^a-z0-9]/g, ''); },
    now: function () { return new Date().toISOString(); },
    lock: function (fn) { return fn(); }
  };
}

function saveXlsx(name, sheets) {

  sheets.forEach(s => {

// Gom mọi ghi nhận (vi phạm/khen trong tiết + sổ nề nếp) thành một danh sách sự kiện có ngày
function eventsOf(data) {
  const ev = [];
  (data.weeks || []).forEach(doc => Object.keys(doc.slots || {}).forEach(k => {
    const e = doc.slots[k]; if (!e) return;
    const iso = dateOf(doc.week, +k[0]);
    const src = 'Tiết ' + k[2] + ' ' + (k[1] === 'S' ? 'sáng' : 'chiều') + ' · ' + e.mon;
    (e.vp || []).forEach(x => ev.push({ ngay: iso, tuan: doc.week, lop: doc.lop, hs: x.hs, loai: 'tru', ma: x.ma, ten: x.ten, kieu: '', diemHS: x.diemHS, diemLop: x.diemLop, ghiChu: x.ghiChu, src: src, by: e.gvName, at: e.signedAt }));
    (e.cong || []).forEach(x => ev.push({ ngay: iso, tuan: doc.week, lop: doc.lop, hs: x.hs, loai: 'cong', ma: x.ma, ten: x.ten, kieu: x.kieu, diemHS: x.diemHS, diemLop: x.diemLop, ghiChu: x.ghiChu, src: src, by: e.gvName, at: e.signedAt }));
  }));
  (data.nenep || []).forEach(r => ev.push({ id: r.id, ngay: r.ngay, tuan: r.tuan, lop: r.lop, hs: r.hs, loai: r.loai, ma: r.ma, ten: r.ten, kieu: r.kieu, diemHS: r.diemHS, diemLop: r.diemLop, ghiChu: r.ghiChu, src: r.nguon, by: r.by, byId: r.byId, at: r.at }));
  return ev.sort((a, b) => (a.ngay < b.ngay ? -1 : a.ngay > b.ngay ? 1 : natSort(a.lop, b.lop)));
}
// Điểm thi đua tuần của một lớp
function classWeekScore(lop, week, data) {
  const P = S.cfg.points;
  const doc = (data.weeks || []).find(d => d.lop === lop && d.week === week);
  let tiet = 0, nTiet = 0;
  Object.values((doc && doc.slots) || {}).forEach(e => { if (!e) return; nTiet++; tiet += Number(P.tiet[e.xepLoai] || 0); });
  let tru = 0, cong = 0, nVP = 0;
  eventsOf({ weeks: doc ? [doc] : [], nenep: (data.nenep || []).filter(r => r.lop === lop && r.tuan === week) }).forEach(x => {
    if (x.loai === 'tru') { tru += x.diemLop; nVP++; } else cong += x.diemLop;
  });
  return { lop: lop, gvcn: gvcnOf(lop), nTiet: nTiet, tiet: tiet, tru: tru, cong: cong, nVP: nVP, total: Math.round((P.lopBase + tiet - tru + cong) * 100) / 100 };
}
function rankRows(rows) {
  rows.sort((a, b) => b.total - a.total || natSort(a.lop, b.lop));
  let prev = null, rank = 0;
  rows.forEach((r, i) => { if (prev === null || r.total !== prev) { rank = i + 1; prev = r.total; } r.rank = rank; });
  return rows;
}
// Điểm rèn luyện tháng của từng học sinh trong lớp
function studentScores(lop, ev) {
  const P = S.cfg.points, names = roster(lop).slice();
  ev.forEach(x => { if (x.lop === lop && x.hs && !names.includes(x.hs)) names.push(x.hs); });
  return names.map((n, i) => {
    const mine = ev.filter(x => x.lop === lop && x.hs === n);
    const tru = mine.filter(x => x.loai === 'tru').reduce((s, x) => s + x.diemHS, 0);
    const cong = mine.filter(x => x.loai === 'cong').reduce((s, x) => s + x.diemHS, 0);
    let diem = P.hsBase - tru + (P.congBuTru ? cong : 0);
    diem = Math.max(0, Math.min(P.hsBase, Math.round(diem * 100) / 100));
    return { stt: i + 1, ten: n, inRoster: i < roster(lop).length, nVP: mine.filter(x => x.loai === 'tru').length, tru: tru, cong: cong,
      dh: mine.filter(x => x.loai === 'cong' && x.kieu === 'dh').length, td: mine.filter(x => x.loai === 'cong' && x.kieu === 'td').length,
      diem: diem, xl: hkRank(diem), ev: mine };
  });
}
function monthsOfYear() {
  const a = S.cfg.school.startDate.split('-').map(Number), out = [];
  for (let i = 0; i < 11; i++) { const m = (a[1] - 1 + i) % 12 + 1, y = a[0] + Math.floor((a[1] - 1 + i) / 12); out.push({ ym: y + '-' + p2(m), label: 'Tháng ' + m + '/' + y }); }
  return out;
}
function monthBounds(ym) {
  const a = ym.split('-').map(Number);
  const last = new Date(Date.UTC(a[0], a[1], 0)).getUTCDate();
  return { from: ym + '-01', to: ym + '-' + p2(last) };
}
async function loadEvents(lops, from, to) {
  const w1 = Math.max(1, weekOf(from)), w2 = Math.min(totalWeeks(), weekOf(to));
  if (w2 < 1 || w1 > totalWeeks() || w2 < w1) return { data: { weeks: [], nenep: [] }, ev: [] };
  const data = await api('getRange', { lops: lops, w1: w1, w2: w2 });
  return { data: data, ev: eventsOf(data).filter(x => x.ngay >= from && x.ngay <= to) };
}
function curMonth() { const t = todayISO().slice(0, 7); const ms = monthsOfYear().map(m => m.ym); return ms.includes(t) ? t : ms[0]; }

async function xlsxReport(fileName, specs) {
  if (!window.ExcelJS) { toast('Chưa tải được thư viện Excel. Kiểm tra mạng rồi thử lại.'); return; }

function buildSheet(wb, sp, logoId) {
  const cols = sp.columns, n = cols.length, sc = S.cfg.school, hasLogo = logoId !== null;
  const ws = wb.addWorksheet(sp.name.replace(/[\\/?*[\]:]/g, '-').slice(0, 31), { properties: { tabColor: { argb: sp.tab || XC.navy } } });
  ws.columns = cols.map((c, i) => ({ width: i === 0 && hasLogo ? Math.max(c.w || 8, 9) : (c.w || 12) }));
  const F = o => Object.assign({ name: XFONT, size: 12, color: { argb: XC.ink } }, o || {});
  const thin = { style: 'thin', color: { argb: XC.line } };
  const box = { top: thin, left: thin, bottom: thin, right: thin };
  const band = (r, c1, c2, val, font, align, fill, border) => {
    if (c2 > c1) ws.mergeCells(r, c1, r, c2);
    const cell = ws.getCell(r, c1);
    cell.value = val; cell.font = F(font);
    cell.alignment = Object.assign({ horizontal: 'center', vertical: 'middle', wrapText: true }, align || {});
    if (fill) for (let c = c1; c <= c2; c++) ws.getCell(r, c).fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: fill } };
    if (border) for (let c = c1; c <= c2; c++) ws.getCell(r, c).border = border;
    return cell;
  };
  // ----- Tiêu đề hành chính -----
  const L1 = hasLogo ? 2 : 1;
  const wOf = i => ws.getColumn(i).width || 10;
  // Khối trái (tên trường) cần ≥ 40 ký tự độ rộng, khối phải (quốc hiệu) ≥ 42
  let split = L1, acc = wOf(L1);
  while (split < n - 1 && acc < 40) { split++; acc += wOf(split); }
  let right = 0; for (let i = split + 1; i <= n; i++) right += wOf(i);
  while (right < 42 && split > L1) { right += wOf(split); acc -= wOf(split); split--; }
  if (acc < 40) { const need = Math.ceil((40 - acc) / (split - L1 + 1)); for (let i = L1; i <= split; i++) ws.getColumn(i).width = wOf(i) + need; }
  band(1, L1, split, String(sc.so || '').toUpperCase(), { size: 12 });
  band(2, L1, split, String(sc.ten || '').toUpperCase(), { bold: true, size: 12.5, color: { argb: XC.navy } });
  band(3, L1, split, '━━━━━━━━', { size: 8, color: { argb: XC.gold } });
  band(1, split + 1, n, 'CỘNG HOÀ XÃ HỘI CHỦ NGHĨA VIỆT NAM', { bold: true, size: 12 });
  band(2, split + 1, n, 'Độc lập – Tự do – Hạnh phúc', { bold: true, size: 12.5 });
  band(3, split + 1, n, '━━━━━━━━━━━━', { size: 8, color: { argb: XC.ink } });
  [1, 2, 3].forEach(r => ws.getRow(r).height = r === 3 ? 12 : 19);
  if (hasLogo) ws.addImage(logoId, { tl: { col: 0.12, row: 0.1 }, ext: { width: 54, height: 54 }, editAs: 'oneCell' });
  ws.getRow(4).height = 8;
  band(5, 1, n, sp.title, { bold: true, size: 15, color: { argb: XC.navy } }); ws.getRow(5).height = 26;
  let r = 6;
  if (sp.subtitle) { band(r, 1, n, sp.subtitle, { bold: true, size: 12.5 }); ws.getRow(r).height = 20; r++; }
  if (sp.info) {
    r++; ws.getRow(r - 1).height = 6;
    const goldLine = { style: 'thin', color: { argb: XC.gold } };
    band(r, 1, n, sp.info, { size: 11.5, color: { argb: XC.ink } }, null, XC.goldBg, { top: goldLine, bottom: goldLine, left: goldLine, right: goldLine });
    ws.getRow(r).height = 22; r++;
  }
  ws.getRow(r).height = 8; r++;
  // ----- Hàng tiêu đề bảng -----
  const hr = r;
  cols.forEach((c, i) => {
    const cell = ws.getCell(hr, i + 1);
    cell.value = c.h; cell.font = F({ bold: true, size: 11.5, color: { argb: XC.white } });
    cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: XC.navy } };
    cell.alignment = { horizontal: 'center', vertical: 'middle', wrapText: true };
    cell.border = { top: { style: 'thin', color: { argb: XC.navy } }, bottom: { style: 'medium', color: { argb: XC.gold } }, left: { style: 'thin', color: { argb: XC.navy2 } }, right: { style: 'thin', color: { argb: XC.navy2 } } };
  });
  ws.getRow(hr).height = 34;
  // ----- Thân bảng -----
  const rows = sp.rows || [];
  if (!rows.length) {
    r++; band(r, 1, n, sp.empty || 'Không có dữ liệu.', { italic: true, color: { argb: XC.muted } }, null, null, box); ws.getRow(r).height = 26;
  }
  rows.forEach((row, ri) => {
    r++;
    const zebra = (sp.group ? sp.group[ri] : ri) % 2 === 1;
    row.forEach((v, ci) => {
      const cell = ws.getCell(r, ci + 1), col = cols[ci];
      cell.value = v === '' || v == null ? null : v;
      const st = (sp.style && sp.style(ri, ci, v, row)) || {};

      cell.alignment = { horizontal: col.align || 'center', vertical: 'middle', wrapText: true, indent: col.align === 'left' ? 1 : 0 };
      cell.border = box;

    });
    ws.getRow(r).height = Math.max(18, Math.min(90, 4 + 14.5 * Math.max(1, ...row.map((v, ci) => Math.ceil(String(v == null ? '' : v).length / Math.max(4, (cols[ci].w || 12) * 1.05))))));
  });
  (sp.merges || []).forEach(mg => ws.mergeCells(hr + 1 + mg[0], mg[1] + 1, hr + 1 + mg[2], mg[3] + 1));
  if (sp.total && rows.length) {
    r++;
    sp.total.forEach((v, ci) => {
      const cell = ws.getCell(r, ci + 1);
      cell.value = v === '' ? null : v; cell.font = F({ bold: true, color: { argb: XC.navy } });
      cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: XC.goldBg } };
      cell.alignment = { horizontal: cols[ci].align || 'center', vertical: 'middle', wrapText: true, indent: cols[ci].align === 'left' ? 1 : 0 };
      cell.border = { top: { style: 'medium', color: { argb: XC.gold } }, bottom: thin, left: thin, right: thin };
    });
    ws.getRow(r).height = 22;
  }
  if (sp.note) { r += 2; band(r, 1, n, sp.note, { italic: true, size: 11, color: { argb: XC.muted } }, { horizontal: 'left' }); ws.getRow(r).height = 30; }
  // ----- Chữ ký -----
  if (sp.signs && sp.signs.length) {
    const k = sp.signs.length, spans = [];
    let c0 = 1;

    r += 2; ws.getRow(r - 1).height = 10;

    spans.forEach((s, i) => band(r, s[0], s[1], sp.signs[i].title, { bold: true })); ws.getRow(r).height = 20; r++;
    spans.forEach((s, i) => band(r, s[0], s[1], sp.signs[i].note || '(Ký, ghi rõ họ tên)', { italic: true, size: 11, color: { argb: XC.muted } })); r++;
    for (let i = 0; i < 3; i++) { r++; ws.getRow(r).height = 17; }
    r++; spans.forEach((s, i) => band(r, s[0], s[1], sp.signs[i].name || '', { bold: true })); ws.getRow(r).height = 20;
  }
  ws.views = [{ state: 'frozen', ySplit: hr, showGridLines: false }];
  // Ước lượng chiều cao in: bảng ngắn thu vừa 1 trang (chữ ký không bị tách trang), bảng dài lặp tiêu đề cột mỗi trang
  let totalH = 0, totalW = 0;
  for (let i = 1; i <= r; i++) totalH += ws.getRow(i).height || 15;
  for (let i = 1; i <= n; i++) totalW += wOf(i);

    margins: { left: 0.4, right: 0.4, top: 0.45, bottom: 0.55, header: 0.25, footer: 0.3 } }, onePage ? {} : { printTitlesRow: hr + ':' + hr });

}

function specToHtml(sp) {

  let h = docHead() + '<h1>' + esc(sp.title) + '</h1>' + (sp.subtitle ? '<h2>' + esc(sp.subtitle) + '</h2>' : '') + (sp.info ? '<div class="info">' + esc(sp.info) + '</div>' : '');

  if (!rows.length) h += '<tr><td colspan="' + cols.length + '" style="text-align:center;font-style:italic">' + esc(sp.empty || 'Không có dữ liệu.') + '</td></tr>';

    });
    h += '</tr>';

  if (sp.total && rows.length) h += '<tr class="t">' + sp.total.map((v, ci) => '<td style="text-align:' + (cols[ci].align || 'center') + '">' + esc(v) + '</td>').join('') + '</tr>';

// Thu nhỏ logo về tối đa 180px, ưu tiên PNG (giữ nền trong suốt), đảm bảo dưới ~40KB để lưu trong một ô Google Sheets
function shrinkLogo(file) {
  return new Promise((resolve, reject) => {
    const fr = new FileReader();
    fr.onerror = () => reject(new Error('Không đọc được ảnh.'));
    fr.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error('File không phải ảnh hợp lệ.'));
      img.onload = () => {
        for (const side of [180, 150, 120, 96]) {
          const k = Math.min(1, side / Math.max(img.naturalWidth || side, img.naturalHeight || side));
          const w = Math.max(1, Math.round((img.naturalWidth || side) * k)), h = Math.max(1, Math.round((img.naturalHeight || side) * k));
          const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
          const g = cv.getContext('2d'); g.imageSmoothingQuality = 'high'; g.drawImage(img, 0, 0, w, h);
          let url = cv.toDataURL('image/png');
          if (url.length > 40000) { g.globalCompositeOperation = 'destination-over'; g.fillStyle = '#fff'; g.fillRect(0, 0, w, h); url = cv.toDataURL('image/jpeg', 0.88); }
          if (url.length <= 40000) { resolve(url); return; }
        }
        reject(new Error('Ảnh quá phức tạp, hãy chọn logo đơn giản hơn.'));
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

    S.ch.draft.catalog = list; chDm(); toast('Đã đọc ' + list.length + ' nội dung. Bấm "Lưu danh mục" để áp dụng.');
  }); };
}
function chTk() {
  const A = S.ch.draft.accounts;
  let editing = null;
  $('chBody').innerHTML = chCard('Nhập danh sách tài khoản',
    '<div class="muted" style="font-size:13px">File Excel/CSV, cột theo thứ tự: <code class="k">Họ và tên</code> <code class="k">Tài khoản</code> <code class="k">Mật khẩu</code> <code class="k">Môn</code> <code class="k">Lớp giảng dạy</code> <code class="k">Lớp chủ nhiệm</code> <code class="k">Vai trò</code> (GV, BGH, DOAN, XUAT). Quyền <b>xuất báo cáo</b>: GVCN (lớp mình), Đoàn trường, BGH, hoặc người được tích "Được xuất báo cáo" (XUAT). Giáo viên chỉ ký sổ những lớp trong cột Lớp giảng dạy; GVCN nhập danh sách học sinh lớp mình.</div>' +
    '<div class="row"><label class="btn sm" style="cursor:pointer">Nhập từ file<input type="file" id="tkFile" accept=".xlsx,.xls,.csv,.txt" hidden></label><button class="btn sm" type="button" id="tkTpl">Tải file mẫu</button></div>') +
    chCard('<span id="tkTitle">Thêm tài khoản</span>',
    '<div class="grid g3"><label class="f">Họ và tên<input class="in" id="tName"></label><label class="f">Tài khoản<input class="in" id="tTk" autocomplete="off"></label><label class="f">Mật khẩu<input class="in" id="tMk" value="123456" autocomplete="off"></label>' +
    '<label class="f">Môn<input class="in" id="tMon" list="dlMon2"></label><label class="f">Lớp giảng dạy (cách nhau dấu phẩy)<input class="in" id="tLop" placeholder="10A1, 11A2"></label><label class="f">Lớp chủ nhiệm<input class="in" id="tCn" placeholder="Để trống nếu không"></label></div>' +
    '<div class="roles">' + Object.keys(CORE_ROLES).map(r => '<label><input type="checkbox" data-r="' + r + '"' + (r === 'GV' ? ' checked' : '') + '> ' + CORE_ROLES[r] + '</label>').join('') + '</div>' +
    '<div class="row end"><button class="btn sm" type="button" id="tReset">Làm mới</button><button class="btn primary" type="button" id="tSave">Lưu tài khoản</button></div><datalist id="dlMon2">' + SUBJECTS.map(s => '<option value="' + esc(s) + '">').join('') + '</datalist>') +
    chCard('Danh sách tài khoản (' + A.length + ')',
    '<div class="tblwrap"><table class="lst"><thead><tr><th>#</th><th>Họ và tên</th><th>Tài khoản</th><th>Mật khẩu</th><th>Môn</th><th>Lớp giảng dạy</th><th>CN</th><th>Vai trò</th><th></th></tr></thead><tbody>' +
    (A.length ? A.map((a, i) => '<tr><td>' + (i + 1) + '</td><td><b>' + esc(a.name) + '</b></td><td>' + esc(a.tk) + '</td><td>' + esc(a.mk) + '</td><td>' + esc(a.mon) + '</td><td>' + esc((a.lop || []).join(', ')) + '</td><td>' + esc(a.cn) + '</td><td>' + (a.roles || []).map(r => '<span class="pill B" style="margin-right:3px">' + r + '</span>').join('') + '</td>' +
      '<td style="white-space:nowrap"><button class="btn sm" type="button" data-ed="' + i + '">Sửa</button> <button class="btn sm danger" type="button" data-del="' + i + '">Xoá</button></td></tr>').join('') : '<tr><td colspan="9" class="empty">Chưa có tài khoản.</td></tr>') + '</tbody></table></div>');
  const reset = () => { editing = null; ['tName', 'tTk', 'tMon', 'tLop', 'tCn'].forEach(i => $(i).value = ''); $('tMk').value = '123456'; $('tkTitle').textContent = 'Thêm tài khoản'; document.querySelectorAll('[data-r]').forEach(c => c.checked = c.dataset.r === 'GV'); };
  $('tReset').onclick = reset;
  $('tSave').onclick = () => {
    const a = { name: $('tName').value.trim(), tk: $('tTk').value.trim().toLowerCase(), mk: $('tMk').value.trim() || '123456', mon: $('tMon').value.trim(), lop: coreList($('tLop').value.toUpperCase()), cn: coreUp($('tCn').value), roles: [...document.querySelectorAll('[data-r]:checked')].map(c => c.dataset.r) };
    if (!a.name || !a.tk) { toast('Cần Họ tên và Tài khoản.'); return; }
    const dup = A.findIndex(x => x.tk === a.tk); if (dup >= 0 && dup !== editing) { toast('Tài khoản "' + a.tk + '" đã dùng cho ' + A[dup].name + '.'); return; }
    const cnDup = a.cn && A.findIndex((x, i) => x.cn === a.cn && i !== editing); if (cnDup >= 0 && a.cn) toast('Lưu ý: lớp ' + a.cn + ' đã có GVCN ' + A[cnDup].name + '.');
    if (editing !== null) Object.assign(A[editing], a); else A.push(Object.assign({ id: 'tk_' + a.tk + '_' + Date.now().toString(36) }, a));
    commit('Đã lưu tài khoản ' + a.name + '.');
  };
  $('chBody').querySelectorAll('[data-ed]').forEach(b => b.onclick = () => {
    const i = +b.dataset.ed, a = A[i]; editing = i;
    $('tName').value = a.name; $('tTk').value = a.tk; $('tMk').value = a.mk; $('tMon').value = a.mon || ''; $('tLop').value = (a.lop || []).join(', '); $('tCn').value = a.cn || '';
    document.querySelectorAll('[data-r]').forEach(c => c.checked = (a.roles || []).includes(c.dataset.r));
    $('tkTitle').textContent = 'Sửa: ' + a.name; $('tName').focus(); $('tName').scrollIntoView({ block: 'center' });
  });
  $('chBody').querySelectorAll('[data-del]').forEach(b => confirmBtn(b, 'Xác nhận', () => { A.splice(+b.dataset.del, 1); commit('Đã xoá tài khoản.'); }));
  $('tkTpl').onclick = () => saveXlsx('Mau_TaiKhoan.xlsx', [{ name: 'TaiKhoan', cols: [26, 12, 10, 14, 22, 12, 14], rows: [['Họ và tên', 'Tài khoản', 'Mật khẩu', 'Môn', 'Lớp giảng dạy', 'Lớp chủ nhiệm', 'Vai trò'],
    ['Lương Khánh Tường', 'tuong', '123456', 'Toán', '10A1, 11A2, 12A1', '12A1', 'GV'], ['Nguyễn Văn Hiệu', 'hieutruong', '123456', '', '', '', 'BGH'], ['Trần Thị Đoàn', 'doan', '123456', 'GD Kinh tế và Pháp luật', '11A2', '', 'GV, DOAN'], ['Phạm Văn Giám Thị', 'giamthi', '123456', '', '', '', 'XUAT']] }]);
  $('tkFile').onchange = e => { const fl = e.target.files[0]; if (!fl) return; readTable(fl, rows => {
    let add = 0, upd = 0;
    rows.forEach(r => {
      const name = (r[0] || '').trim(); if (!name || /^h[oọ]\s*(v[aà]\s*)?t[eê]n/i.test(name)) return;
      const tk = (r[1] || '').trim().toLowerCase() || name.split(/\s+/).pop().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/đ/g, 'd');
      const a = { name: name, tk: tk, mk: (r[2] || '').trim() || '123456', mon: (r[3] || '').trim(), lop: coreList((r[4] || '').toUpperCase()), cn: coreUp(r[5]), roles: coreList((r[6] || 'GV').toUpperCase()) };
      const ex = A.find(x => x.tk === tk); if (ex) { Object.assign(ex, a); upd++; } else { A.push(Object.assign({ id: 'tk_' + tk }, a)); add++; }
    });
    if (!add && !upd) { toast('Không tìm thấy dòng hợp lệ.'); return; }
    commit('Đã nhập: thêm ' + add + ', cập nhật ' + upd + ' tài khoản.');
  }); };
}
function chLop() {
  const D = S.ch.draft, cls = allClasses();
  $('chBody').innerHTML = chCard('Danh sách lớp (' + cls.length + ')',
    '<div class="muted" style="font-size:13px">Lớp được lấy tự động từ phân công giảng dạy và chủ nhiệm. Có thể thêm lớp chưa có phân công.</div>' +
    '<div class="row"><input class="in" id="lNew" placeholder="VD: 10A3" style="max-width:160px"><button class="btn sm" type="button" id="lAdd">Thêm lớp</button></div>' +
    '<div class="tblwrap"><table class="lst"><thead><tr><th>Lớp</th><th>GVCN</th><th class="n">Sĩ số</th><th>Giáo viên giảng dạy</th><th></th></tr></thead><tbody>' +
    cls.map(l => '<tr><td><b>' + esc(l) + '</b></td><td>' + esc(gvcnOf(l) || '—') + '</td><td class="n">' + roster(l).length + '</td><td>' + esc(D.accounts.filter(a => (a.lop || []).includes(l)).map(a => a.name + (a.mon ? ' (' + a.mon + ')' : '')).join(', ')) + '</td>' +
      '<td style="white-space:nowrap"><button class="btn sm" type="button" data-hs="' + esc(l) + '">Học sinh</button>' + ((D.classes || []).includes(l) ? ' <button class="btn sm danger" type="button" data-rm="' + esc(l) + '">Bỏ</button>' : '') + '</td></tr>').join('') + '</tbody></table></div>');
  $('lAdd').onclick = () => { const l = coreUp($('lNew').value); if (!l) return; D.classes = [...new Set((D.classes || []).concat(l))]; commit('Đã thêm lớp ' + l + '.'); };
  $('chBody').querySelectorAll('[data-rm]').forEach(b => confirmBtn(b, 'Xác nhận', () => { D.classes = D.classes.filter(x => x !== b.dataset.rm); commit('Đã bỏ lớp ' + b.dataset.rm + ' khỏi danh sách thêm riêng.'); }));
  $('chBody').querySelectorAll('[data-hs]').forEach(b => b.onclick = () => { S.hs.lop = b.dataset.hs; showView('hs'); });
}
function chDl() {
  $('chBody').innerHTML = chCard('Sao lưu và khôi phục',
    '<div class="muted" style="font-size:13px">File sao lưu (.json) chứa cấu hình, danh mục, tài khoản, học sinh, toàn bộ sổ đầu bài và sổ nề nếp. Dùng để chuyển giữa máy chủ và bản dùng thử, hoặc lưu trữ cuối năm.</div>' +
    '<div class="row"><button class="btn primary sm" type="button" id="dBak">Tải file sao lưu</button><label class="btn sm" style="cursor:pointer">Khôi phục từ file<input type="file" id="dRes" accept=".json" hidden></label></div><div class="err" id="dErr"></div>') +
    chCard('Dữ liệu mẫu để thử',
    '<div class="muted" style="font-size:13px">Thêm 6 tài khoản mẫu (mật khẩu <code class="k">123456</code>): giáo viên <code class="k">tuong</code> (GVCN 12A1), <code class="k">lan</code>, <code class="k">hung</code> (GVCN 10A1), <code class="k">phuc</code>, Đoàn trường <code class="k">doan</code>, Hiệu trưởng <code class="k">hieutruong</code>, cùng danh sách học sinh mẫu 3 lớp. Xoá trong mục Tài khoản khi dùng thật.</div>' +
    '<div class="row"><button class="btn sm" type="button" id="dSample">Nạp dữ liệu mẫu</button></div>') +
    chCard('Chế độ lưu', '<div>' + (S.mode === 'gas' ? 'Đang kết nối máy chủ Google Sheets: <code class="k">' + esc(apiUrl().replace(/^(.{48}).+$/, '$1…')) + '</code>' : 'Đang dùng thử: dữ liệu lưu trên trình duyệt máy này.') + '</div>');
  $('dBak').onclick = async () => {
    try {
      const d = await api('getRange', { lops: allClasses(), w1: 1, w2: totalWeeks() + 1 });
      const cfg = clone(S.cfg); cfg.adminPass = '';
      saveFile('SaoLuu_SoDauBai_' + todayISO() + '.json', JSON.stringify({ app: 'SoDauBai_BTD', ver: 2, at: new Date().toISOString(), cfg: cfg, weeks: d.weeks, nenep: d.nenep }));
    } catch (e) { $('dErr').textContent = e.message; }
  };
  $('dRes').onchange = e => { const f = e.target.files[0]; if (!f) return; const fr = new FileReader(); fr.onload = async () => {
    try {
      const o = JSON.parse(fr.result);
      if (!o.cfg && !o.config) throw new Error('File không đúng định dạng sao lưu.');
      const d = await api('restore', { cfg: o.cfg || o.config, weeks: o.weeks || [], nenep: o.nenep || [] });
      S.cfg = coreMergeCfg(d.cfg); S.ch.draft = clone(S.cfg); renderShell(); renderCh(); toast('Đã khôi phục ' + (o.weeks || []).length + ' tuần sổ, ' + (o.nenep || []).length + ' ghi nhận nề nếp.');
    } catch (er) { $('dErr').textContent = 'Không khôi phục được: ' + er.message; }
  }; fr.readAsText(f); };
  $('dSample').onclick = () => {
    const D = S.ch.draft;
    const add = (name, tk, mon, lop, cn, roles) => { if (!D.accounts.find(a => a.tk === tk)) D.accounts.push({ id: 'tk_' + tk, name: name, tk: tk, mk: '123456', mon: mon, lop: lop, cn: cn, roles: roles }); };
    add('Lương Khánh Tường', 'tuong', 'Toán', ['10A1', '11A2', '12A1'], '12A1', ['GV']);
    add('Nguyễn Thị Lan', 'lan', 'Ngữ văn', ['10A1', '12A1'], '', ['GV']);
    add('Trần Văn Hùng', 'hung', 'Tiếng Anh', ['10A1', '11A2', '12A1'], '10A1', ['GV']);
    add('Lê Minh Phúc', 'phuc', 'Vật lí', ['11A2', '12A1'], '11A2', ['GV']);
    add('Võ Thị Thu Đoàn', 'doan', 'GD Kinh tế và Pháp luật', ['10A1'], '', ['GV', 'DOAN']);
    add('Nguyễn Văn Hiệu', 'hieutruong', '', [], '', ['BGH']);
    const ho = ['Nguyễn', 'Trần', 'Lê', 'Phạm', 'Huỳnh', 'Võ', 'Đặng', 'Bùi', 'Phan', 'Đỗ', 'Ngô', 'Dương'];
    const dem = ['Văn', 'Thị', 'Minh', 'Ngọc', 'Hoàng', 'Thanh', 'Gia', 'Quốc', 'Thảo', 'Bảo'];
    const ten = ['An', 'Bình', 'Châu', 'Duy', 'Hà', 'Khang', 'Linh', 'Phát', 'Vy', 'Tâm', 'Nhi', 'Phúc', 'Quân', 'Trâm', 'Hưng', 'Yến'];
    ['10A1', '11A2', '12A1'].forEach((l, k) => { if (!(D.students[l] || []).length) D.students[l] = Array.from({ length: 16 }, (_, i) => ho[(i * 5 + k) % ho.length] + ' ' + dem[(i * 3 + k) % dem.length] + ' ' + ten[(i + k * 4) % ten.length]); });
    if (!D.school.hieuTruong) D.school.hieuTruong = 'Nguyễn Văn Hiệu';
    if (!D.school.biThuDoan) D.school.biThuDoan = 'Võ Thị Thu Đoàn';
    commit('Đã nạp dữ liệu mẫu: 6 tài khoản, 3 lớp, 48 học sinh.');
  };
}

/* ===================================================================
 * KHỞI ĐỘNG
 * =================================================================== */
(async function init() {
  S.mode = apiUrl() ? 'gas' : 'local';
  renderLoginInfo();
  api('brand', {}).then(b => { if (!S.me) applyBrand(b); }).catch(() => { });
  let s = null; try { s = JSON.parse(localStorage.getItem(SS_KEY)); } catch (e) { }
  if (s && s.token && s.mode === S.mode) {
    S.token = s.token;
    $('lgBtn').textContent = 'Đang mở phiên làm việc…'; $('lgBtn').disabled = true;
    try { const d = await api('getPublic', {}); S.me = d.me; S.cfg = coreMergeCfg(d.cfg); enterApp(); }
    catch (e) { S.token = ''; try { localStorage.removeItem(SS_KEY); } catch (x) { } }
    $('lgBtn').textContent = 'Đăng nhập'; $('lgBtn').disabled = false;
  }
})();
})();

</script>
